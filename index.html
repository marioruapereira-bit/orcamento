<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Orçamento Pessoal — Painel</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root{--bg:#E7EBE9;--surface:#FBFCFB;--ink:#17211E;--muted:#5C6B66;--faint:#8B968F;--line:#D3DAD7;--accent:#1F6E5A;--warn:#B5533A;--gold:#B98A3C;}
*{box-sizing:border-box;} body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;padding:24px clamp(14px,4vw,40px);}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px;border-bottom:1.5px solid var(--ink);padding-bottom:14px;}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px;}
.title{font-size:clamp(24px,4vw,36px);font-weight:600;line-height:1;letter-spacing:-.01em;font-family:'Fraunces',Georgia,serif;}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;font-size:13px;font-weight:500;padding:8px 14px;border-radius:999px;cursor:pointer;font-family:inherit;} .btn:hover{opacity:.86;} .btn.ghost{background:transparent;color:var(--ink);}
.month-switch{display:flex;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;flex-wrap:wrap;}
.month-btn{border:none;background:transparent;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;padding:6px 12px;border-radius:999px;cursor:pointer;} .month-btn:hover{color:var(--ink);} .month-btn.on{background:var(--ink);color:#fff;}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:48px 30px;text-align:center;max-width:560px;margin:60px auto;}
.empty h2{font-family:'Fraunces',serif;font-weight:600;margin:0 0 10px;font-size:24px;} .empty p{color:var(--muted);line-height:1.55;margin:0 0 22px;font-size:14px;}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;} @media(max-width:720px){.kpis{grid-template-columns:repeat(2,1fr);}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;position:relative;overflow:hidden;}
.kpi.hero{background:var(--ink);} .kpi .rail{position:absolute;left:0;top:0;bottom:0;width:4px;}
.kpi .lab{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--muted);margin-bottom:8px;} .kpi.hero .lab{color:#AEB9B4;}
.kpi .val{font-size:24px;font-weight:600;letter-spacing:-.02em;} .kpi.hero .val{color:#fff;} .kpi .sub{font-size:12px;color:var(--faint);margin-top:3px;}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin-bottom:16px;} @media(max-width:900px){.grid2{grid-template-columns:1fr;}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px;}
.panel-t{font-size:17px;font-weight:600;font-family:'Fraunces',Georgia,serif;} .panel-n{font-size:12px;color:var(--muted);}
.track{height:9px;background:#E4E9E6;border-radius:6px;position:relative;overflow:hidden;margin-top:6px;}
.track-sm{height:6px;background:#E4E9E6;border-radius:4px;position:relative;overflow:hidden;margin-top:4px;}
.track-fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;transition:width .5s cubic-bezier(.2,.7,.3,1);}
.dot{width:9px;height:9px;border-radius:3px;flex-shrink:0;display:inline-block;} .dot-sm{width:6px;height:6px;border-radius:2px;flex-shrink:0;display:inline-block;}
.over{color:var(--warn);font-weight:600;}
.chevron{display:inline-block;font-size:10px;color:var(--faint);margin-left:4px;transition:transform .2s;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:0 10px 8px;border-bottom:1px solid var(--line);}
th.r{text-align:right;} td{padding:8px 10px;border-bottom:1px solid #EAEEEC;} td.r{text-align:right;} tbody tr:hover td{background:#F3F6F4;}
.clear-btn{display:inline-block;background:var(--ink);color:#fff;font-size:11px;padding:3px 10px;border-radius:999px;cursor:pointer;margin-left:8px;border:none;font-family:inherit;}
.edit-btn{border:none;background:transparent;color:var(--faint);cursor:pointer;font-size:11px;padding:2px 6px;border-radius:4px;font-family:inherit;} .edit-btn:hover{background:#E4E9E6;color:var(--ink);}
.cat-select{font-size:12px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;font-family:inherit;background:var(--surface);color:var(--ink);max-width:160px;}
.search-box{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;background:var(--surface);color:var(--ink);outline:none;margin-bottom:12px;} .search-box:focus{border-color:var(--accent);}
.save-toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:500;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99;} .save-toast.show{opacity:1;}
.pie-seg{cursor:pointer;transition:opacity .15s,transform .15s;transform-origin:100px 100px;}
.leg-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;cursor:pointer;transition:opacity .15s;}
.err{color:var(--warn);font-size:13px;margin-top:12px;} .filestat{font-size:12px;color:var(--faint);}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="save-toast"></div>
<script>
"use strict";
const CC={"Alimentação / Supermercado":"#6E9B5A","Automóvel":"#7A8E3D","Automóvel - Combustível":"#8BA04A","Automóvel - Leasing":"#6B8030","Automóvel - Manutenção":"#5D7228","Automóvel - Via Verde":"#9AAF58","Compras":"#A64B4B","Educação":"#7C5B9A","Educação - ATL / Centro Social":"#8C6BAA","Educação - Desporto":"#9C7BBA","Educação - Escola de Línguas":"#6C4B8A","Habitação":"#1A4E3E","Habitação - Empregada doméstica":"#3A6E5E","Habitação - Obras":"#2A5E4E","Habitação - Prestação":"#4A7E6E","Lazer":"#B0563C","Outros":"#8A8578","Restaurantes / Café":"#BE6E4A","Saúde":"#C08A3E","Seguros":"#5B7A8C","Transporte":"#8AA36B","Utilities":"#4A7C6F","Utilities - Eletricidade":"#5A8C7F","Utilities - Gás":"#3A6C5F","Utilities - Telecomunicações":"#6A9C8F","Utilities - Água":"#2A5C4F","Vinhos":"#7A3040","Vinhos - Garrafeira":"#8A4050","Vinhos - Particular":"#6A2030"};
const ML={"01":"Jan","02":"Fev","03":"Mar","04":"Abr","05":"Mai","06":"Jun","07":"Jul","08":"Ago","09":"Set","10":"Out","11":"Nov","12":"Dez"};
const eur=n=>new Intl.NumberFormat("pt-PT",{style:"currency",currency:"EUR"}).format(n||0);
const eur0=n=>new Intl.NumberFormat("pt-PT",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n||0);
const sc=c=>(c||"").replace(/ \(.*\)/,"");
const sd=d=>(d||"").replace(/^COMPRA \d* ?/,"").replace(/^DD /,"").replace(/ CONTACTLESS$/,"").replace(/\s{2,}.*$/,"").trim();
const gm=c=>c.includes(" - ")?c.split(" - ")[0].trim():c;
const gs=c=>c.includes(" - ")?c.split(" - ")[1].trim():null;

let S={data:null,month:null,ec:null,fc:null,search:"",fileName:null,fileHandle:null,rawBuf:null,editIdx:null,hovPie:null};

// ---- IDB ----
const IDB="orcamento-db",STORE="handles";
function idb(){return new Promise((r,j)=>{const q=indexedDB.open(IDB,1);q.onupgradeneeded=()=>q.result.createObjectStore(STORE);q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error);});}
async function saveH(h){try{(await idb()).transaction(STORE,"readwrite").objectStore(STORE).put(h,"excel");}catch(e){}}
async function loadH(){try{const db=await idb();return new Promise(r=>{const g=db.transaction(STORE,"readonly").objectStore(STORE).get("excel");g.onsuccess=()=>r(g.result||null);g.onerror=()=>r(null);});}catch(e){return null;}}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200);}

// ---- Parse ----
function parse(buf){
  const wb=XLSX.read(buf,{cellDates:true});
  const get=n=>wb.Sheets[n]?XLSX.utils.sheet_to_json(wb.Sheets[n],{defval:null}):[];
  const orc=get("Orçamento").filter(r=>r["Categoria"]&&r["Categoria"]!=="TOTAL");
  const budget={},catOrder=[];
  orc.forEach(r=>{const k=r["Subcategoria"]?r["Categoria"]+" - "+r["Subcategoria"]:r["Categoria"];budget[k]=Number(r["Orçamento Mensal (€)"]||0);catOrder.push(k);});
  const txR=get("Transações").filter(r=>r["Data"]!=null&&r["Valor (€)"]!=null);
  const tx=txR.map((r,i)=>{let d=r["Data"],iso;if(d instanceof Date)iso=d.toISOString().slice(0,10);else{const s=String(d);iso=s.length>=10?s.slice(0,10):s;}
    return{date:iso,desc:String(r["Descrição"]||""),cat:r["Subcategoria"]?r["Categoria"]+" - "+r["Subcategoria"]:(r["Categoria"]||"Outros"),amount:Math.abs(Number(r["Valor (€)"]||0)),_row:i+2};});
  const rec=get("Despesas Recorrentes").filter(r=>r["Nome"]&&r["Nome"]!=="TOTAL MENSAL EQUIVALENTE").map(r=>({name:r["Nome"],monthly:r["Frequência"]==="Anual"?Number(r["Valor (€)"]||0)/12:Number(r["Valor (€)"]||0)}));
  return{budget,catOrder,transactions:tx,recurring:rec};
}
async function loadFile(f){const buf=await f.arrayBuffer();S.rawBuf=buf.slice(0);S.data=parse(buf);S.fileName=f.name;
  const ms=[...new Set(S.data.transactions.map(t=>t.date.slice(0,7)))].sort();S.month=ms[ms.length-1]||null;
  S.ec=null;S.fc=null;S.search="";S.editIdx=null;S.hovPie=null;render();}

// ---- File I/O ----
async function pickFile(){
  if(window.showOpenFilePicker){try{const[h]=await window.showOpenFilePicker({types:[{description:"Excel",accept:{"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":[".xlsx"]}}]});
    let p=await h.queryPermission({mode:"readwrite"});if(p!=="granted")p=await h.requestPermission({mode:"readwrite"});
    S.fileHandle=h;await saveH(h);await loadFile(await h.getFile());}catch(e){if(e?.name!=="AbortError")showErr(e.message);}
  }else{const inp=document.createElement("input");inp.type="file";inp.accept=".xlsx";inp.onchange=async()=>{if(inp.files[0])await loadFile(inp.files[0]);};inp.click();}}
async function reopenLast(){const h=await loadH();if(!h)return;try{let p=await h.queryPermission({mode:"readwrite"});if(p!=="granted")p=await h.requestPermission({mode:"readwrite"});if(p!=="granted")return;S.fileHandle=h;await loadFile(await h.getFile());}catch(e){}}
async function refresh(){if(S.fileHandle){try{await loadFile(await S.fileHandle.getFile());return;}catch(e){}}pickFile();}
function showErr(m){const e=document.querySelector(".err");if(e)e.textContent=m;}

// ---- Write-back ----
async function writeCat(idx,newCat){
  const tx=S.data.transactions[idx],old=tx.cat;tx.cat=newCat;
  if(S.rawBuf&&S.fileHandle){try{const wb=XLSX.read(S.rawBuf,{cellDates:true}),ws=wb.Sheets["Transações"];
    if(ws){const r=tx._row,cC=XLSX.utils.encode_cell({r:r-1,c:2}),cD=XLSX.utils.encode_cell({r:r-1,c:3});
      ws[cC]={t:"s",v:gm(newCat)};ws[cD]={t:"s",v:gs(newCat)||""};
      const out=XLSX.write(wb,{bookType:"xlsx",type:"buffer"});const w=await S.fileHandle.createWritable();await w.write(out);await w.close();
      S.rawBuf=out.buffer||out;toast("✓ Excel atualizado — "+sc(newCat));}
  }catch(e){tx.cat=old;toast("Erro: "+e.message);}}else toast("Alterado (sem permissão de escrita)");
  S.editIdx=null;render();}

// ---- Compute ----
function compute(){
  const D=S.data,m=S.month,allTx=D.transactions;
  const monthTx=m?allTx.filter(t=>t.date.startsWith(m)):allTx;
  const months=[...new Set(allTx.map(t=>t.date.slice(0,7)))].sort();
  const nM=m?1:12;const bT=Object.values(D.budget).reduce((a,b)=>a+b,0);const vB=bT*nM;
  const mT=monthTx.reduce((a,t)=>a+t.amount,0);const rM=D.recurring.reduce((a,r)=>a+(r.monthly||0),0);
  // grouped
  const map={};D.catOrder.forEach(k=>{const main=gm(k),sub=gs(k);if(!map[main])map[main]={budget:0,spent:0,subs:[]};
    const sp=monthTx.filter(t=>t.cat===k).reduce((a,t)=>a+t.amount,0);map[main].budget+=D.budget[k]*nM;map[main].spent+=sp;
    if(sub)map[main].subs.push({key:k,subLabel:sub,budget:D.budget[k]*nM,spent:sp});});
  const grouped=Object.entries(map).map(([main,v])=>({main,...v})).sort((a,b)=>b.spent-a.spent);
  // trend (reacts to filter)
  const fc=S.fc,ec=S.ec;
  const trend=months.map(mo=>{let txm=allTx.filter(t=>t.date.startsWith(mo));let orc=bT;
    if(fc){txm=txm.filter(t=>t.cat===fc);orc=D.budget[fc]||0;}
    else if(ec){txm=txm.filter(t=>gm(t.cat)===ec);orc=D.catOrder.filter(k=>gm(k)===ec).reduce((a,k)=>a+(D.budget[k]||0),0);}
    return{mo,label:ML[mo.slice(5,7)]||mo,gasto:txm.reduce((a,t)=>a+t.amount,0),orc};});
  // pie
  const pieMap={};monthTx.forEach(t=>{const main=gm(t.cat);pieMap[main]=(pieMap[main]||0)+t.amount;});
  const pieData=Object.entries(pieMap).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).map(([n,v])=>({name:n,value:v}));
  const pieTotal=pieData.reduce((a,d)=>a+d.value,0);
  // pie segments
  const R=80,r=50,cx=100,cy=100;let a0=-Math.PI/2;
  const pieSegs=pieData.map(d=>{const frac=d.value/pieTotal;const a1=a0+frac*2*Math.PI;
    const x0=cx+R*Math.cos(a0),y0=cy+R*Math.sin(a0),x1=cx+R*Math.cos(a1),y1=cy+R*Math.sin(a1);
    const xi1=cx+r*Math.cos(a1),yi1=cy+r*Math.sin(a1),xi0=cx+r*Math.cos(a0),yi0=cy+r*Math.sin(a0);
    const large=(a1-a0)>Math.PI?1:0;const path=`M${x0} ${y0} A${R} ${R} 0 ${large} 1 ${x1} ${y1} L${xi1} ${yi1} A${r} ${r} 0 ${large} 0 ${xi0} ${yi0} Z`;
    a0=a1;return{path,color:CC[d.name]||"#888",name:d.name,value:d.value,pct:Math.round(frac*100)};});
  // vis
  let vis=monthTx.slice();if(fc)vis=vis.filter(t=>t.cat===fc);else if(ec)vis=vis.filter(t=>gm(t.cat)===ec);
  if(S.search){const q=S.search.toLowerCase();vis=vis.filter(t=>t.desc.toLowerCase().includes(q)||t.cat.toLowerCase().includes(q));}
  vis.sort((a,b)=>a.date<b.date?1:-1);
  return{monthTx,months,grouped,mT,vB,rM,trend,pieSegs,pieTotal,vis,nM};
}

// ---- SVGs ----
function trendSVG(trend){
  const W=340,H=170,pad=38;const xs=trend.map((_,i)=>trend.length>1?pad+i*(W-pad-10)/(trend.length-1):W/2);
  const maxV=Math.max(...trend.map(t=>Math.max(t.gasto,t.orc)),1);const y=v=>H-pad-(v/maxV)*(H-pad-12);
  const grid=[0,.5,1].map(f=>`<line x1="${pad}" y1="${y(maxV*f)}" x2="${W-6}" y2="${y(maxV*f)}" stroke="#E4E9E6"/><text x="${pad-5}" y="${y(maxV*f)+4}" text-anchor="end" font-family="IBM Plex Mono" font-size="9" fill="#8B968F">${Math.round(maxV*f/1000)}k</text>`).join("");
  const orcP=trend.map((t,i)=>`${xs[i]},${y(t.orc)}`).join(" ");
  const gasP=trend.map((t,i)=>`${xs[i]},${y(t.gasto)}`).join(" ");
  const dots=trend.map((t,i)=>`<circle cx="${xs[i]}" cy="${y(t.gasto)}" r="3.5" fill="#1F6E5A"/>`).join("");
  const labs=trend.map((t,i)=>`<text x="${xs[i]}" y="${H-10}" text-anchor="middle" font-family="IBM Plex Mono" font-size="10" fill="#5C6B66">${t.label}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="180">${grid}<polyline points="${orcP}" fill="none" stroke="#B0BAB5" stroke-width="1.5" stroke-dasharray="4 4"/><polyline points="${gasP}" fill="none" stroke="#1F6E5A" stroke-width="2.5"/>${dots}${labs}</svg>`;
}
function pieSVG(segs,total,hov){
  if(!segs.length)return"";
  const paths=segs.map((s,i)=>`<path class="pie-seg" d="${s.path}" fill="${s.color}" style="opacity:${hov!==null&&hov!==i?.45:1};transform:scale(${hov===i?1.04:1})" onmouseenter="S.hovPie=${i};render()" onmouseleave="S.hovPie=null;render()"/>`).join("");
  const cLabel=hov!==null?segs[hov].name:"Total";
  const cVal=hov!==null?eur0(segs[hov].value):eur0(total);
  const cPct=hov!==null?`<text x="100" y="118" text-anchor="middle" font-family="IBM Plex Mono" font-size="11" fill="#8B968F">${segs[hov].pct}%</text>`:"";
  return `<svg viewBox="0 0 200 200" width="180" height="180" style="display:block;margin:0 auto">${paths}<text x="100" y="${hov!==null?88:95}" text-anchor="middle" font-family="IBM Plex Mono" font-size="${hov!==null?10:11}" fill="#8B968F">${cLabel}</text><text x="100" y="${hov!==null?104:112}" text-anchor="middle" font-family="IBM Plex Mono" font-size="15" font-weight="600" fill="#17211E">${cVal}</text>${cPct}</svg>`;
}

// ---- Render ----
function render(){
  const app=document.getElementById("app");
  if(!S.data){app.innerHTML=`<div class="head"><div><div class="eyebrow">Orçamento pessoal · 2026</div><div class="title">O teu mês, ao cêntimo</div></div></div>
    <div class="empty"><h2 style="font-family:'Fraunces',serif">Carrega o teu Orçamento</h2><p>Escolhe o ficheiro <b>Orcamento_Pessoal.xlsx</b>. No Chrome pede permissão de leitura e escrita para poderes alterar categorias directamente.</p>
    <button class="btn" onclick="pickFile()">Escolher ficheiro Excel</button><div class="err"></div></div>`;return;}

  const C=compute(),m=S.month,diff=C.vB-C.mT,al=S.fc?sc(S.fc):S.ec?S.ec:null;
  const visTot=C.vis.reduce((a,t)=>a+t.amount,0);

  // months
  const mBtns=C.months.map(mo=>`<button class="month-btn ${mo===m?'on':''}" onclick="S.month='${mo}';S.ec=null;S.fc=null;S.search='';S.editIdx=null;S.hovPie=null;render()">${ML[mo.slice(5,7)]||mo}</button>`).join("");

  // tracks
  let tracks="";
  C.grouped.forEach(g=>{
    const hs=g.subs.length>0,isE=S.ec===g.main;
    const pct=g.budget>0?g.spent/g.budget:(g.spent>0?2:0),over=g.spent>g.budget&&g.budget>0;
    const col=CC[g.main]||"#888",fw=Math.min(pct,1)*100;
    const isA=al===g.main||(S.fc&&gm(S.fc)===g.main),dim=al&&!isA?"opacity:.35":"";
    const click=hs?`S.ec=S.ec==='${g.main}'?null:'${g.main}';S.fc=null;S.editIdx=null;render();`
      :`S.ec=null;S.fc=S.fc==='${g.main}'?null:'${g.main}';S.editIdx=null;render();`;
    let subsH="";
    if(hs&&isE){subsH=`<div style="padding-left:20px;margin-top:8px;margin-bottom:10px;border-left:2px solid #E4E9E6">`;
      g.subs.filter(s=>s.spent>0||s.budget>0).forEach(sub=>{
        const sp=sub.budget>0?sub.spent/sub.budget:(sub.spent>0?2:0),so=sub.spent>sub.budget&&sub.budget>0;
        const scl=CC[sub.key]||col,sf=Math.min(sp,1)*100,sa=S.fc===sub.key,sdim=S.fc&&!sa?"opacity:.4":"";
        const esc=sub.key.replace(/'/g,"\\'");
        subsH+=`<div style="margin-bottom:10px;cursor:pointer;${sdim}" onclick="event.stopPropagation();S.fc=S.fc==='${esc}'?null:'${esc}';S.editIdx=null;render();">
          <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px;gap:8px">
            <span style="font-size:12px;font-weight:${sa?600:400};display:flex;align-items:center;gap:6px;color:${sa?'var(--ink)':'var(--muted)'}"><span class="dot-sm" style="background:${scl}"></span>${sub.subLabel}</span>
            <span class="mono" style="font-size:11px;color:var(--faint)"><b style="color:var(--muted)">${eur0(sub.spent)}</b> / ${eur0(sub.budget)} ${so?`<span class="over">+${eur0(sub.spent-sub.budget)}</span>`:""}</span>
          </div><div class="track-sm"><div class="track-fill" style="width:${sf}%;background:${so?'var(--warn)':scl}"></div></div></div>`;
      });subsH+=`</div>`;}
    tracks+=`<div style="margin-bottom:${hs&&isE?4:14}px;${dim}"><div style="cursor:pointer" onclick="${click}">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;gap:10px">
        <span style="font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px"><span class="dot" style="background:${col}"></span>${g.main}${hs?`<span class="chevron" style="transform:rotate(${isE?90:0}deg)">▶</span>`:""}</span>
        <span class="mono" style="font-size:12px;color:var(--muted)"><b style="color:var(--ink)">${eur0(g.spent)}</b> / ${eur0(g.budget)} ${over?`<span class="over">+${eur0(g.spent-g.budget)}</span>`:""}</span>
      </div><div class="track"><div class="track-fill" style="width:${fw}%;background:${over?'var(--warn)':col}"></div></div></div>${subsH}</div>`;
  });

  // tx rows
  const txR=C.vis.map((t,vi)=>{
    const idx=S.data.transactions.indexOf(t),isEd=S.editIdx===idx;
    const catD=isEd?`<select class="cat-select" onchange="writeCat(${idx},this.value)">${S.data.catOrder.map(k=>`<option value="${k}" ${k===t.cat?'selected':''}>${sc(k)}</option>`).join("")}</select> <button class="edit-btn" onclick="S.editIdx=null;render()">✕</button>`
      :`<span style="color:var(--muted);font-size:11px">${sc(t.cat)}</span> <button class="edit-btn" onclick="event.stopPropagation();S.editIdx=${idx};render()">✎</button>`;
    return `<tr><td class="mono" style="color:var(--faint);font-size:12px">${t.date.slice(8,10)}/${t.date.slice(5,7)}${!m?"/"+t.date.slice(2,4):""}</td>
      <td><div>${sd(t.desc)}</div><div style="margin-top:2px">${catD}</div></td><td class="r mono" style="font-weight:500">${eur(t.amount)}</td></tr>`;
  }).join("");

  const clearB=al?`<button class="clear-btn" onclick="S.ec=null;S.fc=null;S.editIdx=null;render()">✕</button>`:"";

  // pie legend
  const pLeg=C.pieSegs.slice(0,8).map((d,i)=>`<div class="leg-row" style="opacity:${S.hovPie!==null&&S.hovPie!==i?.45:1}" onmouseenter="S.hovPie=${i};render()" onmouseleave="S.hovPie=null;render()">
    <span style="display:flex;align-items:center;gap:7px;color:var(--muted)"><span style="width:8px;height:8px;border-radius:3px;background:${d.color};flex-shrink:0;display:inline-block"></span>${d.name}</span>
    <span class="mono" style="color:var(--faint)">${eur0(d.value)} · ${d.pct}%</span></div>`).join("");

  app.innerHTML=`
  <div class="head"><div><div class="eyebrow">Orçamento pessoal · 2026</div><div class="title">O teu mês, ao cêntimo</div></div>
    <div class="controls"><div class="month-switch">${mBtns}<button class="month-btn ${!m?'on':''}" style="font-family:inherit;font-weight:600;font-size:12px" onclick="S.month=null;S.ec=null;S.fc=null;S.search='';S.editIdx=null;S.hovPie=null;render()">Anual</button></div>
    <button class="btn ghost" onclick="refresh()">Atualizar</button><button class="btn" onclick="pickFile()">Trocar ficheiro</button></div></div>
  <div class="filestat mono" style="margin-bottom:18px">📄 ${S.fileName} ${S.fileHandle?'<span style="color:var(--accent)">· escrita activa</span>':'<span style="color:var(--warn)">· só leitura</span>'}</div>
  <div class="kpis">
    <div class="kpi hero"><div class="rail" style="background:#3F7E6B"></div><div class="lab">${m?"Gasto no mês":"Gasto anual"}</div><div class="val mono">${eur0(C.mT)}</div><div class="sub">${C.monthTx.length} movimentos</div></div>
    <div class="kpi"><div class="rail" style="background:var(--faint)"></div><div class="lab">${m?"Orçamento":"Orçamento anual"}</div><div class="val mono">${eur0(C.vB)}</div></div>
    <div class="kpi"><div class="rail" style="background:${diff>=0?'var(--accent)':'var(--warn)'}"></div><div class="lab">${diff>=0?'Folga':'Excesso'}</div><div class="val mono" style="color:${diff>=0?'var(--accent)':'var(--warn)'}">${eur0(Math.abs(diff))}</div></div>
    <div class="kpi"><div class="rail" style="background:var(--gold)"></div><div class="lab">Despesas fixas</div><div class="val mono">${eur0(C.rM)}</div><div class="sub">${S.data.recurring.length} débitos/mês</div></div>
  </div>
  <div class="grid2">
    <div class="panel"><div class="panel-h"><div class="panel-t">Orçamento vs. real</div><div class="panel-n">clica para expandir →</div></div>${tracks}</div>
    <div class="panel"><div class="panel-h"><div class="panel-t">${al||"Movimentos"}</div><div class="panel-n" style="display:flex;align-items:center">${C.vis.length} mov.${al?" · "+eur0(visTot):""} ${clearB}</div></div>
      <input class="search-box" type="text" placeholder="Pesquisar movimentos..." value="${S.search.replace(/"/g,'&quot;')}" oninput="S.search=this.value;render()"/>
      ${C.vis.length===0?`<p style="color:var(--faint);text-align:center;padding:24px 0;font-size:14px">Sem movimentos${al?" nesta categoria":""}.</p>`:
      `<div style="max-height:440px;overflow-y:auto"><table><thead><tr><th>Data</th><th>Descrição</th><th class="r">Valor</th></tr></thead><tbody>${txR}</tbody></table></div>`}
    </div>
  </div>
  <div class="grid2">
    <div class="panel"><div class="panel-h"><div class="panel-t">Tendência${al?" · "+al:""}</div><div class="panel-n">${al?"vs. orçamento da categoria":"vs. orçamento total"}</div></div>${trendSVG(C.trend)}</div>
    <div class="panel"><div class="panel-h"><div class="panel-t">Repartição</div><div class="panel-n">${m?ML[m.slice(5,7)]:"Anual"} · por categoria</div></div>
      ${pieSVG(C.pieSegs,C.pieTotal,S.hovPie)}
      <div style="display:flex;flex-direction:column;gap:7px;margin-top:14px">${pLeg}</div>
    </div>
  </div>`;
}
render();reopenLast();
</script>
</body>
</html>
